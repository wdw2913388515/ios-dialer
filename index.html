<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS 风格拨号键盘</title>
    <meta http-equiv="refresh" content="0; url=ios_dialer.html">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #000;
        }
        .redirect-box {
            text-align: center;
        }
        .redirect-box a {
            color: #007aff;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <p>正在跳转到拨号键盘...</p>
        <p><a href="ios_dialer.html">如果没有自动跳转，点这里</a></p>
    </div>
    <script>
        // 注册 Service Worker 实现离线缓存
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => {
                    console.warn('[SW] 注册失败:', err);
                });
            });
        }
    </script>
</body>
</html>
